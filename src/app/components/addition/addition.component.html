<div class="exercise-root" tabindex="0" (keydown)="handleKeydown($event)">
  <div class="exercise-container">
    <div class="main-area">
      <div class="problem-display">
        <div class="operand-display">{{ operandA() }}</div>
        <div class="operator">+</div>
        <div class="operand-display">{{ operandB() }}</div>
        <div class="equals">=</div>
        <div class="question-mark">?</div>
      </div>

      <div class="input-section">
        <input
          #answerInput
          type="text"
          inputmode="none"
          readonly
          [value]="userAnswer()"
          (keydown.enter)="submitAnswer()"
          aria-label="Ergebnis eingeben"
          autocomplete="off"
          class="answer-input"
          placeholder="0"
          tabindex="0"
          maxlength="3"
        />
      </div>

      <div class="keypad">
        <button type="button" (click)="addDigit('1')">1</button>
        <button type="button" (click)="addDigit('2')">2</button>
        <button type="button" (click)="addDigit('3')">3</button>
        <button type="button" (click)="addDigit('4')">4</button>
        <button type="button" (click)="addDigit('5')">5</button>
        <button type="button" (click)="addDigit('6')">6</button>
        <button type="button" (click)="addDigit('7')">7</button>
        <button type="button" (click)="addDigit('8')">8</button>
        <button type="button" (click)="addDigit('9')">9</button>
        <button type="button" class="btn-del" (click)="deleteDigit()">&#x232b;</button>
        <button type="button" (click)="addDigit('0')">0</button>
        <button
          type="button"
          class="btn-ok"
          [class.btn-disabled]="userAnswer() === ''"
          [disabled]="userAnswer() === ''"
          (click)="submitAnswer()">OK</button>
      </div>

      <div class="feedback-area">
        @if (feedback() === 'correct') {
          <div class="feedback correct">&#x2713; Richtig!</div>
        }
        @if (feedback() === 'incorrect') {
          <div class="feedback incorrect">
            &#x2717; Falsch. @if (showCorrectAnswer()) {
              <span>Richtige Antwort: {{ correctAnswer() }}</span>
            }
          </div>
        }
      </div>

      <div class="result-summary">
        <span class="badge badge-correct">&#x2713; {{ typeCorrectCount() }}</span>
        <span class="badge badge-incorrect">&#x2717; {{ typeIncorrectCount() }}</span>
        <span class="badge badge-total">&#x3a3; {{ typeTotalCount() }}</span>
        <span class="summary-label">Heute</span>
      </div>
    </div>
  </div>
</div>
