@if (user()) {
  <div class="user-profile">
    <img
      class="user-avatar"
      [src]="getAvatarUrl()"
      [alt]="user()!.username"
    />

    <div class="user-info">
      <div class="username">{{ user()!.username }}</div>
    </div>

    <button
      class="switch-user-btn"
      (click)="switchUser()"
      title="Benutzer wechseln"
    >
      Wechseln
    </button>
  </div>
}
