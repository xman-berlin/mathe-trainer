<div class="letter-keypad">
  <div class="keypad-rows">
    @for (row of rows; track $index) {
      <div class="keypad-row">
        @for (letter of row; track letter) {
          <button
            type="button"
            class="key-btn letter-key"
            [disabled]="disabled()"
            (click)="appendLetter(letter)"
          >{{ letter }}</button>
        }
      </div>
    }
  </div>

  <div class="keypad-actions">
    <button
      type="button"
      class="key-btn action-key replay-key"
      [disabled]="disabled()"
      (click)="onReplayAudio()"
      title="Wort nochmal hören"
    >🔊</button>

    <div class="answer-display">{{ value() || '…' }}</div>

    <button
      type="button"
      class="key-btn action-key delete-key"
      [disabled]="disabled() || value() === ''"
      (click)="deleteLetter()"
    >⌫</button>
  </div>

  <button
    type="button"
    class="ok-btn"
    [disabled]="disabled() || value() === ''"
    (click)="onSubmit()"
  >OK</button>
</div>
