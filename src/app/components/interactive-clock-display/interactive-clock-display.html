<div class="interactive-clock-container">
  <svg
    #clockSvg
    viewBox="0 0 200 200"
    class="clock-svg"
    (mousedown)="$event.preventDefault()"
    (touchstart)="$event.preventDefault()">

    <!-- Clock face circle -->
    <circle cx="100" cy="100" r="95" class="clock-face" />

    <!-- Minute tick marks -->
    @for (tick of minuteTickMarks; track tick) {
      <line
        [attr.x1]="getMinuteTick(tick).x1"
        [attr.y1]="getMinuteTick(tick).y1"
        [attr.x2]="getMinuteTick(tick).x2"
        [attr.y2]="getMinuteTick(tick).y2"
        [class.minute-tick--hour]="isHourTick(tick)"
        class="minute-tick"
      />
    }

    <!-- Hour numbers -->
    @for (hour of hourMarkers; track hour) {
      <text
        [attr.x]="getHourPosition(hour).x"
        [attr.y]="getHourPosition(hour).y + 1"
        class="hour-number"
        text-anchor="middle"
        dominant-baseline="middle">
        {{ hour }}
      </text>
    }

    <!-- Center dot -->
    <circle cx="100" cy="100" r="5" class="center-dot" />

    <!-- Minute hand with touch target and handle -->
    <g
      [style.transform]="'rotate(' + minuteAngle() + 'deg)'"
      [style.transform-origin]="'100px 100px'">
      <!-- Invisible wide touch target for easier grabbing -->
      <line
        x1="100"
        y1="100"
        x2="100"
        y2="30"
        class="minute-hand-touch-target"
        (mousedown)="startDrag('minute', $event)"
        (touchstart)="startDrag('minute', $event)"
      />
      <!-- Visible hand -->
      <line
        x1="100"
        y1="100"
        x2="100"
        y2="30"
        class="minute-hand"
        [class.dragging]="isDraggingMinute()"
      />
      <!-- Touch handle at the end -->
      <circle
        cx="100"
        cy="30"
        r="8"
        class="minute-hand-handle"
        [class.dragging]="isDraggingMinute()"
        (mousedown)="startDrag('minute', $event)"
        (touchstart)="startDrag('minute', $event)"
      />
    </g>

    <!-- Hour hand with touch target and handle -->
    <g
      [style.transform]="'rotate(' + hourAngle() + 'deg)'"
      [style.transform-origin]="'100px 100px'">
      <!-- Invisible wide touch target for easier grabbing (only when not locked) -->
      @if (!lockHourHand()) {
        <line
          x1="100"
          y1="100"
          x2="100"
          y2="50"
          class="hour-hand-touch-target"
          (mousedown)="startDrag('hour', $event)"
          (touchstart)="startDrag('hour', $event)"
        />
      }
      <!-- Visible hand -->
      <line
        x1="100"
        y1="100"
        x2="100"
        y2="50"
        class="hour-hand"
        [class.dragging]="isDraggingHour()"
        [class.hour-hand--locked]="lockHourHand()"
      />
      <!-- Touch handle at the end (only when not locked) -->
      @if (!lockHourHand()) {
        <circle
          cx="100"
          cy="50"
          r="8"
          class="hour-hand-handle"
          [class.dragging]="isDraggingHour()"
          (mousedown)="startDrag('hour', $event)"
          (touchstart)="startDrag('hour', $event)"
        />
      }
    </g>

  </svg>
</div>
