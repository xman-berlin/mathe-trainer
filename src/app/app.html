<nav>
  <div class="nav-container">
    <a href="/" class="logo">🧮 Mathe-Trainer</a>
    <ul class="nav-menu">
      <li><a routerLink="/addition">Addition</a></li>
    </ul>
  </div>
</nav>

<main>
  <router-outlet></router-outlet>

  <ng-container *ngIf="!isExercisePage()">
    <section class="content-area stats-area" style="margin-top: 2rem;">
      <div class="stats-card">
        <h2>Heutige Statistik</h2>
        <div class="stats-badges">
          <span class="badge badge-correct">✓ {{ stats.correctCount() }}</span>
          <span class="badge badge-incorrect">✗ {{ stats.incorrectCount() }}</span>
          <span class="badge badge-total">Σ {{ stats.totalCount() }}</span>
        </div>

        <div *ngIf="exerciseTypes().length > 0" class="stats-by-type">
          <div class="type-stats">
            <div *ngFor="let type of exerciseTypes()" class="type-item">
              <span class="type-name">{{ getExerciseLabel(type) }}</span>
              <span class="type-badges">
                <span class="type-badge type-correct">✓ {{ getTypeStats(type).correct }}</span>
                <span class="type-badge type-incorrect">✗ {{ getTypeStats(type).incorrect }}</span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </ng-container>
</main>

<footer *ngIf="!isExercisePage()">
  <p>&copy; 2026 Mathe-Trainer. Alle Rechte vorbehalten.</p>
</footer>
